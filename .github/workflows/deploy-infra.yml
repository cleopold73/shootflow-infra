name: Deploy Infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_uri:
        description: 'Optional ECR image URI override for production'
        required: false
        type: string
      confirmation:
        description: 'Type "I understand" to confirm production deployment'
        required: true
        default: 'I understand'
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, leia, ubuntu-24.04, disposable, ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - run: python -m pip install poetry==1.8.4
      - run: poetry install --no-interaction
      - name: Validate and synthesize both environments without AWS credentials
        run: |
          set -euo pipefail
          poetry run python -m compileall -q app.py shootflow_infra
          poetry run npx --yes aws-cdk@2.1024.0 synth --all -c env=development --quiet
          poetry run npx --yes aws-cdk@2.1024.0 synth --all -c env=production --quiet

  changes:
    needs: validate
    if: github.repository == 'cleopold73/shootflow-infra' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, leia, ubuntu-24.04, disposable, ci]
    outputs:
      ecr: ${{ steps.filter.outputs.ecr }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Detect changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          ecr:
            - 'shootflow_infra/ecr_stack.py'
            - 'app.py'

  deploy_ecr:
    permissions:
      contents: read
      id-token: write
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.ecr == 'true'
    runs-on: [self-hosted, Linux, X64, leia, ubuntu-24.04, disposable, ci]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::477763023369:role/ShootflowOIDCRole
        aws-region: us-east-1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install pipx
      run: |
        python3 -m pip install --user pipx
        python3 -m pipx ensurepath
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install Poetry
      run: |
        pipx install poetry==1.8.4

    - name: Install dependencies
      run: poetry install

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install AWS CDK CLI
      run: npm install -g aws-cdk@2.1024.0

    - name: Synthesize ECR stack
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        cdk synth ShootflowEcrStack
      env:
        AWS_DEFAULT_REGION: us-east-1

    - name: Deploy ECR stack
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        cdk deploy --require-approval never ShootflowEcrStack
      env:
        AWS_DEFAULT_REGION: us-east-1

  deploy_dev:
    permissions:
      contents: read
      id-token: write
    needs: validate
    if: github.repository == 'cleopold73/shootflow-infra' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, leia, ubuntu-24.04, disposable, ci]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::477763023369:role/ShootflowOIDCRole
        aws-region: us-east-1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install pipx
      run: |
        python3 -m pip install --user pipx
        python3 -m pipx ensurepath
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install Poetry
      run: |
        pipx install poetry==1.8.4

    - name: Install dependencies
      run: poetry install

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install AWS CDK CLI
      run: npm install -g aws-cdk@2.1024.0

    - name: Synthesize CDK stack (development)
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        if [ -n "${IMAGE_URI}" ]; then IMAGE_ARG="-c imageUri=${IMAGE_URI}"; else IMAGE_ARG=""; fi
        cdk synth ShootflowInfraStack-development -c env=development $IMAGE_ARG
      env:
        AWS_DEFAULT_REGION: us-east-1

    - name: Deploy Infrastructure (development)
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        if [ -n "${IMAGE_URI}" ]; then IMAGE_ARG="-c imageUri=${IMAGE_URI}"; else IMAGE_ARG=""; fi
        cdk deploy --require-approval never ShootflowInfraStack-development -c env=development $IMAGE_ARG
      env:
        AWS_DEFAULT_REGION: us-east-1


  approve_production:
    needs: [deploy_dev]
    if: github.repository == 'cleopold73/shootflow-infra' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, leia, ubuntu-24.04, disposable, ci]
    timeout-minutes: 6
    permissions:
      issues: write
      contents: read
    steps:
      - name: Wait for manual approval to deploy to production
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.repository_owner }}
          minimum-approvals: 1
          issue-title: "Approve production deployment"
          issue-body: "Approve to proceed with production deployment for commit ${{ github.sha }}."
          exclude-workflow-initiator: false
          timeout-minutes: 5

  deploy_production:
    permissions:
      contents: read
      id-token: write
    needs: [approve_production]
    if: github.repository == 'cleopold73/shootflow-infra' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, leia, ubuntu-24.04, disposable, ci]
    environment:
      name: production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::477763023369:role/ShootflowOIDCRole
        aws-region: us-east-1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install pipx
      run: |
        python3 -m pip install --user pipx
        python3 -m pipx ensurepath
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install Poetry
      run: |
        pipx install poetry==1.8.4

    - name: Install dependencies
      run: poetry install

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install AWS CDK CLI
      run: npm install -g aws-cdk@2.1024.0

    - name: Synthesize CDK stack (production)
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        if [ -n "${IMAGE_URI}" ]; then IMAGE_ARG="-c imageUri=${IMAGE_URI}"; else IMAGE_ARG=""; fi
        cdk synth ShootflowInfraStack-production -c env=production $IMAGE_ARG
      env:
        AWS_DEFAULT_REGION: us-east-1

    - name: Deploy Infrastructure (production)
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        if [ -n "${IMAGE_URI}" ]; then IMAGE_ARG="-c imageUri=${IMAGE_URI}"; else IMAGE_ARG=""; fi
        cdk deploy --require-approval never ShootflowInfraStack-production -c env=production $IMAGE_ARG
      env:
        AWS_DEFAULT_REGION: us-east-1
