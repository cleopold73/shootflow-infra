name: Deploy Infrastructure

on:
  push:
    branches:
      - main  # Trigger on push to the main branch
  workflow_dispatch:  # Allow manual trigger of the workflow

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    
    # Step 1: Check out the code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Configure AWS credentials via OIDC
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::477763023369:role/ShootflowOIDCRole
        aws-region: us-east-1

    # Step 3: Set up Python 3.10
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # Use Python 3.10 for the workflow

    # Step 4: Install pipx
    - name: Install pipx
      run: |
        python3 -m pip install --user pipx
        python3 -m pipx ensurepath

    # Step 5: Install Poetry using pipx
    - name: Install Poetry
      run: |
        pipx install poetry==1.8.4

    # Step 6: Install dependencies using Poetry
    - name: Install dependencies
      run: poetry install

    # Step 7: Set up Node.js (required for AWS CDK CLI)
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'  # Specify compatible Node.js version (or latest stable)

    # Step 8: Install the AWS CDK CLI globally using npm
    - name: Install AWS CDK CLI
      run: npm install -g aws-cdk@2.90.0  # Or replace with latest stable version

    # Step 9: Bootstrap the AWS environment
    - name: Bootstrap the AWS environment
      run: cdk bootstrap aws://477763023369/us-east-1
      env:
        AWS_DEFAULT_REGION: us-east-1

    # Step 10: Synthesize CDK stack (optional for validation)
    - name: Synthesize CDK stack
      run: cdk synth
      env:
        AWS_DEFAULT_REGION: us-east-1

    # Step 11: Deploy the CDK stack
    - name: Deploy Infrastructure
      run: cdk deploy --require-approval never
      env:
        AWS_DEFAULT_REGION: us-east-1

    # Step 12: Run Python-based post-deployment tests (if needed)
    - name: Test infrastructure (optional)
      run: poetry run shootflow-infra
      env:
        AWS_DEFAULT_REGION: us-east-1