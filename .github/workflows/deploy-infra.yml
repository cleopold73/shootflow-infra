name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_uri:
        description: 'Optional ECR image URI override for production'
        required: false
        type: string
      confirmation:
        description: 'Type "I understand" to confirm production deployment'
        required: true
        default: 'I understand'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ecr: ${{ steps.filter.outputs.ecr }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Detect changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          ecr:
            - 'shootflow_infra/ecr_stack.py'
            - 'app.py'

  deploy_ecr:
    needs: changes
    if: needs.changes.outputs.ecr == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::477763023369:role/ShootflowOIDCRole
        aws-region: us-east-1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install pipx
      run: |
        python3 -m pip install --user pipx
        python3 -m pipx ensurepath

    - name: Install Poetry
      run: |
        pipx install poetry==1.8.4

    - name: Install dependencies
      run: poetry install

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install AWS CDK CLI
      run: npm install -g aws-cdk@2.1024.0

    - name: Synthesize ECR stack
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        cdk synth ShootflowEcrStack
      env:
        AWS_DEFAULT_REGION: us-east-1

    - name: Deploy ECR stack
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        cdk deploy --require-approval never ShootflowEcrStack
      env:
        AWS_DEFAULT_REGION: us-east-1

  deploy_dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::477763023369:role/ShootflowOIDCRole
        aws-region: us-east-1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install pipx
      run: |
        python3 -m pip install --user pipx
        python3 -m pipx ensurepath

    - name: Install Poetry
      run: |
        pipx install poetry==1.8.4

    - name: Install dependencies
      run: poetry install

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install AWS CDK CLI
      run: npm install -g aws-cdk@2.1024.0

    - name: Synthesize CDK stack (development)
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        if [ -n "${IMAGE_URI}" ]; then IMAGE_ARG="-c imageUri=${IMAGE_URI}"; else IMAGE_ARG=""; fi
        cdk synth ShootflowInfraStack-development -c env=development $IMAGE_ARG
      env:
        AWS_DEFAULT_REGION: us-east-1

    - name: Deploy Infrastructure (development)
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        if [ -n "${IMAGE_URI}" ]; then IMAGE_ARG="-c imageUri=${IMAGE_URI}"; else IMAGE_ARG=""; fi
        cdk deploy --require-approval never ShootflowInfraStack-development -c env=development $IMAGE_ARG
      env:
        AWS_DEFAULT_REGION: us-east-1

  validate_dev_success:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Ensure latest development deployment succeeded
        run: |
          set -euo pipefail
          API="https://api.github.com"
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer ${{ github.token }}"
          ACCEPT="Accept: application/vnd.github+json"

          # Fetch latest completed push run on main for this workflow file
          RUNS_JSON=$(curl -sSf -H "$AUTH" -H "$ACCEPT" \
            "$API/repos/${REPO}/actions/workflows/deploy-infra.yml/runs?event=push&branch=main&status=completed&per_page=1")

          RUN_ID=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[0].id // empty')
          WF_CONCLUSION=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[0].conclusion // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No completed push workflow runs found on main."
            exit 1
          fi

          echo "Latest push workflow conclusion: ${WF_CONCLUSION}"
          if [ "$WF_CONCLUSION" != "success" ]; then
            echo "Latest push workflow did not succeed."
            exit 1
          fi

          # Verify the specific development job succeeded in that run
          JOBS_JSON=$(curl -sSf -H "$AUTH" -H "$ACCEPT" \
            "$API/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")

          DEV_JOB_CONCLUSION=$(echo "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="Deploy Infrastructure (development)") | .conclusion // empty' | head -n1)

          if [ -z "$DEV_JOB_CONCLUSION" ]; then
            echo "Development job not found in the latest push run."
            exit 1
          fi

          echo "Development job conclusion: ${DEV_JOB_CONCLUSION}"
          if [ "$DEV_JOB_CONCLUSION" != "success" ]; then
            echo "Development deployment did not succeed."
            exit 1
          fi

  deploy_production:
    if: github.event_name == 'workflow_dispatch'
    needs: validate_dev_success
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::477763023369:role/ShootflowOIDCRole
        aws-region: us-east-1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install pipx
      run: |
        python3 -m pip install --user pipx
        python3 -m pipx ensurepath

    - name: Install Poetry
      run: |
        pipx install poetry==1.8.4

    - name: Install dependencies
      run: poetry install

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install AWS CDK CLI
      run: npm install -g aws-cdk@2.1024.0

    - name: Validate confirmation input
      run: |
        if [ "${{ github.event.inputs.confirmation }}" != "I understand" ]; then
          echo "Confirmation phrase mismatch. Aborting."
          exit 1
        fi

    - name: Set IMAGE_URI from input (optional)
      run: |
        if [ -n "${{ github.event.inputs.image_uri }}" ]; then
          echo "IMAGE_URI=${{ github.event.inputs.image_uri }}" >> $GITHUB_ENV
        fi

    - name: Synthesize CDK stack (production)
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        if [ -n "${IMAGE_URI}" ]; then IMAGE_ARG="-c imageUri=${IMAGE_URI}"; else IMAGE_ARG=""; fi
        cdk synth ShootflowInfraStack-production -c env=production $IMAGE_ARG
      env:
        AWS_DEFAULT_REGION: us-east-1

    - name: Deploy Infrastructure (production)
      run: |
        VENV_PATH=$(poetry env info --path)
        source "$VENV_PATH/bin/activate"
        if [ -n "${IMAGE_URI}" ]; then IMAGE_ARG="-c imageUri=${IMAGE_URI}"; else IMAGE_ARG=""; fi
        cdk deploy --require-approval never ShootflowInfraStack-production -c env=production $IMAGE_ARG
      env:
        AWS_DEFAULT_REGION: us-east-1